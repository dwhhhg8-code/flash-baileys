name: Move
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files
        run: |
          shopt -s dotglob
          mv flash-baileys/* .
          rmdir flash-baileys
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Move files to root" || echo "nothing to commit"
          git push
