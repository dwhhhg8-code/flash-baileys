name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q *.zip
          cp -r flash-baileys/. .
          rm -rf flash-baileys *.zip
          git config user.name "dwhhhg8-code"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "flash-baileys v2.0.0"
          git push
